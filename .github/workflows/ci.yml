name: CI and CD

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/extension/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: npm --prefix build/extension ci
      - run: npm --prefix build/extension run ci:test

  build:
    name: Build packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/extension/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: npm --prefix build/extension ci
      - run: npm --prefix build/extension run ci:build
      - uses: actions/upload-artifact@v4
        with:
          name: zen-mcp-release
          path: build/artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zen-mcp-release
          path: release-assets
      - run: bash scripts/ci-release.sh release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
